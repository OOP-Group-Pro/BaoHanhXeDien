server:
  port: 8080   # Thay port
  error:
    include-message: always
    include-binding-errors: always

vehicle-service:
  url: http://localhost:8002/
user-service:
  url: http://localhost:8001/
part-service:
  url: http://localhost:8004/
warranty-service:
  url: http://localhost:8005/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM

  datasource:
    url: "jdbc:mysql://mysql-db:3306/campaign_service?createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000"
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN

  main:
    allow-bean-definition-overriding: true
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password123
    listener:
      simple:
        acknowledge-mode: auto

  # 🔥 [THÊM ĐOẠN NÀY ĐỂ FIX LỖI 500 "UNKNOWN ERROR"] 🔥
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false # Trả về dạng String "2025-11-23T..." thay vì mảng số
    time-zone: Asia/Ho_Chi_Minh       # Múi giờ VN
    default-property-inclusion: non_null # Bỏ qua các trường null cho gọn
  # -----------------------------------------------------

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  rabbitmq:
    exchange: oem.internal.exchange
    queue: campaign.inventory.low.queue  # Tên Queue riêng của Campaign
    routing-key: inventory.low           # Key cần lắng nghe (khớp với Part Service)
