<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Claim Mới - OEM EV Warranty</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ====== CSS CHUNG CHO TOÀN BỘ HỆ THỐNG (TỪ TEMPLATE) ====== */
        :root {
            --primary-blue: #3B82F6;
            --primary-blue-dark: #2563EB;
            --sidebar-bg: #1E1E2D;
            --content-bg: #F3F4F6;
            --white: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #F9FAFB;
            --text-secondary: #9CA3AF;
            --border-color: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            background-color: var(--content-bg);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar (Menu trái) ===== */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-logo .logo-icon {
            font-size: 1.5rem; /* Placeholder cho logo V */
        }
        .sidebar-logo h2 {
            font-size: 1.25rem;
            color: var(--white);
        }

        .sidebar-nav {
            list-style: none;
            margin-top: 24px;
        }

        .sidebar-nav li {
            margin-bottom: 8px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .sidebar-nav a i {
            margin-right: 16px;
            width: 20px;
            text-align: center;
        }

        .sidebar-nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a.active {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .sidebar-user {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-user .avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--content-bg);
            color: var(--text-dark);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }
        .sidebar-user .user-name {
            font-weight: 500;
            color: var(--white);
        }

        /* ===== Main content area ===== */
        .main-content {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
            display: flex;
            justify-content: center; /* Căn giữa form theo chiều ngang */
            align-items: flex-start; /* Căn form lên trên */
            padding-top: 60px; /* Đẩy form xuống 1 chút */
        }

        /* ====== BỔ SUNG CSS MỚI CHO TRANG NÀY ====== */

        .create-claim-form {
            width: 100%;
            max-width: 500px; /* Giới hạn độ rộng của form */
            background-color: var(--white);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .create-claim-form h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .create-claim-form .subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Loading spinner cho VIN */
        .vin-input-group {
            position: relative;
        }

        .vin-spinner {
            position: absolute;
            right: 14px;
            top: 42px; /* Điều chỉnh cho vừa ô input */
            color: var(--text-secondary);
            display: none; /* Ẩn ban đầu */
        }

        .vin-spinner.loading {
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Phần chi tiết (klapp) --- */
        .details-section {
            padding: 16px;
            background-color: #F9FAFB; /* Nền xám nhạt */
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
        }

        .details-header i {
            transition: transform 0.2s;
        }

        .details-content {
            margin-top: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            max-height: 0; /* Ẩn ban đầu */
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .details-content p {
            margin-bottom: 8px;
        }

        /* Lớp .open để hiển thị nội dung */
        .details-content.open {
            max-height: 200px; /* Chiều cao đủ để chứa nội dung */
        }

        .details-header.open i {
            transform: rotate(180deg);
        }

        /* --- Nút bấm --- */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-grow: 1; /* Chia đều 2 nút */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: var(--white);
        }
        .btn-primary:hover {
            background-color: var(--primary-blue-dark);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: var(--content-bg);
        }

        #api-response {
            margin-top: 16px;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }
        .success { color: var(--status-approved-text); }
        .error { color: var(--status-rejected-text); }

    </style>
</head>
<body>
<!-- Sidebar -->
<nav class="sidebar">
    <!-- Sử dụng Logo và Tên EVM như trong ảnh -->
    <div class="sidebar-logo">
        <i class="fa-solid fa-bolt logo-icon"></i> <!-- Placeholder cho logo V -->
        <h2>OEM EV</h2>
    </div>

    <!-- Trang này dành cho SC Staff (có thể là menu khác EVM) -->
    <ul class="sidebar-nav">
        <li><a href="dashboard-sc.html"><i class="fa-solid fa-tachometer-alt"></i>Dashboard</a></li>
        <!-- Trang Tạo Claim Mới là active -->
        <li><a href="#" class="active"><i class="fa-solid fa-plus"></i>Tạo Claim Mới</a></li>
        <li><a href="claims-sc.html"><i class="fa-solid fa-file-invoice"></i>Danh sách Claim</a></li>
        <li><a href="#"><i class="fa-solid fa-calendar-alt"></i>Lịch hẹn Campaign</a></li>
    </ul>

    <div class="sidebar-user">
        <div class="avatar-sm">S</div>
        <span class="user-name">SC Staff (Đạt)</span>
    </div>
</nav>

<!-- Nội dung chính -->
<main class="main-content" id="main-content">

    <form class="create-claim-form" id="create-claim-form">
        <h1>Tạo Claim Mới</h1>
        <p class="subtitle">Nhân viên Trung tâm Dịch vụ</p>

        <!-- 1. Form nhập VIN -->
        <div class="form-group">
            <label for="vin-input">VIN</label>
            <div class="vin-input-group">
                <input type="text" id="vin-input" name="vin" placeholder="Nhập 17 ký tự số VIN..." required>
                <!-- Spinner sẽ hiện khi đang gọi API -->
                <i class="fa-solid fa-spinner vin-spinner" id="vin-spinner"></i>
            </div>
        </div>

        <!-- 2. Thông tin xe (Auto-fill) -->
        <div class="details-section">
            <div class="details-header" id="vehicle-details-header">
                <span>Chi tiết xe</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="details-content" id="vehicle-details-content">
                <p><strong>Biển số:</strong> <span id="vehicle-plate">...</span></p>
                <p><strong>Model:</strong> <span id="vehicle-model">...</span></p>
                <p><strong>Năm SX:</strong> <span id="vehicle-year">...</span></p>
            </div>
        </div>

        <!-- 3. Thông tin khách hàng (Auto-fill) -->
        <div class="details-section">
            <div class="details-header" id="customer-details-header">
                <span>Thông tin Khách hàng</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="details-content" id="customer-details-content">
                <p><strong>Tên:</strong> <span id="customer-name">...</span></p>
                <p><strong>SĐT:</strong> <span id="customer-phone">...</span></p>
            </div>
        </div>

        <!-- 4. Mô tả sự cố -->
        <div class="form-group">
            <label for="description">Mô tả sự cố</label>
            <textarea id="description" name="description" placeholder="Mô tả chi tiết sự cố, ví dụ: Xe sụt pin nhanh, màn hình taplo báo lỗi pin..." required></textarea>
        </div>

        <!-- (Bổ sung: Phụ tùng yêu cầu, theo DTO) -->
        <div class="form-group">
            <label for="requested-parts">Phụ tùng yêu cầu (Nhập Part ID, cách nhau bằng dấu phẩy)</label>
            <input type="text" id="requested-parts" name="requestedParts" placeholder="Ví dụ: 1, 3">
        </div>

        <!-- Thông báo API (Lỗi/Thành công) -->
        <div id="api-response"></div>

        <!-- 5. Nút hành động -->
        <div class="form-actions">
            <!-- Nút "Hủy" trong ảnh -->
            <button type="button" class="btn btn-secondary" id="cancel-btn">Hủy</button>
            <!-- Nút "Đính kèm..." trong ảnh, coi là nút Submit -->
            <button type="submit" class="btn btn-primary" id="submit-btn">
                <i class="fa-solid fa-paperclip"></i>
                <span>Gửi Claim (Đính kèm)</span>
            </button>
        </div>
    </form>

</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- ĐỊNH NGHĨA CÁC API ENDPOINT ---
        // (Giả định các port)
        const WARRANTY_SERVICE_URL = 'http://localhost:8005';
        const VEHICLE_SERVICE_URL = 'http://localhost:8003'; // (Giả sử Vehicle Service ở 8003)

        // --- LẤY CÁC ELEMENT ---
        const vinInput = document.getElementById('vin-input');
        const vinSpinner = document.getElementById('vin-spinner');
        const apiResponse = document.getElementById('api-response');
        const submitBtn = document.getElementById('submit-btn');
        const claimForm = document.getElementById('create-claim-form');

        // Collapsible sections
        const vehicleHeader = document.getElementById('vehicle-details-header');
        const vehicleContent = document.getElementById('vehicle-details-content');
        const customerHeader = document.getElementById('customer-details-header');
        const customerContent = document.getElementById('customer-details-content');

        // --- HÀM MOCK API GỌI XE (Auto-fill) ---
        // API thật: GET /api/v1/vehicles/{vin} (Từ Vehicle-Service)
        async function fetchVehicleInfo(vin) {
            vinSpinner.classList.add('loading'); // Hiển thị spinner

            // --- PHẦN GỌI API THẬT (ĐANG BỊ COMMENT) ---
            /*
            try {
                const response = await fetch(`${VEHICLE_SERVICE_URL}/api/v1/vehicles/${vin}`);
                if (!response.ok) {
                    throw new Error('Không tìm thấy thông tin xe cho VIN này.');
                }
                const data = await response.json();

                // Điền dữ liệu thật
                document.getElementById('vehicle-plate').textContent = data.licensePlate || 'N/A';
                document.getElementById('vehicle-model').textContent = data.model || 'N/A';
                document.getElementById('vehicle-year').textContent = data.year || 'N/A';
                document.getElementById('customer-name').textContent = data.customer.name || 'N/A';
                document.getElementById('customer-phone').textContent = data.customer.phone || 'N/A';

                // Tự động mở 2 tab chi tiết
                openDetails(vehicleHeader, vehicleContent);
                openDetails(customerHeader, customerContent);

                apiResponse.textContent = '';

            } catch (error) {
                console.error("Lỗi khi fetch thông tin xe:", error);
                apiResponse.textContent = error.message;
                apiResponse.className = 'error';
            } finally {
                vinSpinner.classList.remove('loading');
            }
            */
            // --- Kết thúc API thật ---

            // --- PHẦN MOCK (GIẢ LẬP) ĐỂ TEST ---
            // (Xóa phần này khi chạy API thật)
            setTimeout(() => {
                if (vin === "VIN123") {
                    document.getElementById('vehicle-plate').textContent = "51H-12345";
                    document.getElementById('vehicle-model').textContent = "EV-300";
                    document.getElementById('vehicle-year').textContent = "2023";
                    document.getElementById('customer-name').textContent = "Nguyễn Văn A";
                    document.getElementById('customer-phone').textContent = "0912-555-678";

                    openDetails(vehicleHeader, vehicleContent);
                    openDetails(customerHeader, customerContent);
                    apiResponse.textContent = '';
                } else {
                    apiResponse.textContent = 'Không tìm thấy thông tin xe cho VIN này.';
                    apiResponse.className = 'error';
                }
                vinSpinner.classList.remove('loading');
            }, 1000); // Giả lập 1 giây chờ mạng
            // --- Kết thúc phần Mock ---
        }

        // --- HÀM TẠO CLAIM (Submit Form) ---
        // API thật: POST /api/v1/claims (Từ WarrantyController)
        async function handleCreateClaim(event) {
            event.preventDefault(); // Ngăn form submit
            setButtonLoading(true);

            // 1. Lấy dữ liệu từ Form (khớp với CreateClaimDto.java)
            const formData = new FormData(claimForm);

            // Chuyển đổi list phụ tùng (chuỗi "1, 3") thành mảng DTO
            const requestedPartsList = formData.get('requestedParts').split(',')
                .map(partId => partId.trim())
                .filter(partId => partId.length > 0)
                .map(partId => ({ partNumber: partId, quantity: 1 })); // Giả định số lượng là 1

            // Tạo JSON body
            const claimData = {
                vin: formData.get('vin'),
                description: formData.get('description'),
                technicianId: 101, // Giả định ID Kỹ thuật viên
                isRecall: false,
                requestedParts: requestedPartsList,
                attachedDocuments: [ // Giả định file đính kèm
                    { fileName: "diagnosis_report.pdf", storagePath: "/uploads/report.pdf" }
                ]
            };

            console.log("Đang gửi Claim:", JSON.stringify(claimData, null, 2));

            // 2. Gọi API POST /api/v1/claims
            try {
                const response = await fetch(`${WARRANTY_SERVICE_URL}/api/v1/claims`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(claimData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Lỗi khi tạo Claim');
                }

                const newClaimId = await response.json();

                // Thành công!
                apiResponse.textContent = `Tạo Claim thành công! Mã Claim ID: ${newClaimId}`;
                apiResponse.className = 'success';
                claimForm.reset(); // Xóa trắng form

            } catch (error) {
                console.error("Lỗi khi tạo Claim:", error);
                apiResponse.textContent = `Lỗi: ${error.message}`;
                apiResponse.className = 'error';
            } finally {
                setButtonLoading(false);
            }
        }

        // --- HÀM HELPER (Hỗ trợ) ---

        // Helper để xử lý nút loading
        function setButtonLoading(isLoading) {
            submitBtn.disabled = isLoading;
            const span = submitBtn.querySelector('span');
            if (isLoading) {
                span.textContent = "Đang gửi...";
            } else {
                span.textContent = "Gửi Claim (Đính kèm)";
            }
        }

        // Helper cho hiệu ứng klapp
        function toggleDetails(header, content) {
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                header.classList.remove('open');
            } else {
                openDetails(header, content);
            }
        }

        function openDetails(header, content) {
            content.classList.add('open');
            header.classList.add('open');
        }

        // --- GÁN SỰ KIỆN ---

        // 1. Tự động tìm xe khi người dùng gõ xong VIN
        vinInput.addEventListener('change', (e) => {
            const vin = e.target.value;
            if (vin && vin.length >= 10) { // Giả định VIN có ít nhất 10 ký tự
                fetchVehicleInfo(vin);
            }
        });

        // 2. Gán sự kiện submit cho form
        claimForm.addEventListener('submit', handleCreateClaim);

        // 3. Gán sự kiện cho các tab klapp
        vehicleHeader.addEventListener('click', () => toggleDetails(vehicleHeader, vehicleContent));
        customerHeader.addEventListener('click', () => toggleDetails(customerHeader, customerContent));

        // 4. Nút Hủy
        document.getElementById('cancel-btn').addEventListener('click', () => {
            if (confirm("Bạn có chắc muốn hủy? Mọi thông tin đã nhập sẽ bị mất.")) {
                claimForm.reset();
                apiResponse.textContent = '';
            }
        });

    });
</script>

</body>
</html>
