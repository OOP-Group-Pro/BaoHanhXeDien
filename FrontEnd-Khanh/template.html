<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEM EV Warranty Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ====== CSS CHUNG CHO TOÀN BỘ HỆ THỐNG ====== */
        :root {
            --primary-blue: #3B82F6;
            --primary-blue-dark: #2563EB;
            --sidebar-bg: #1E1E2D;
            --content-bg: #F3F4F6;
            --white: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #F9FAFB;
            --text-secondary: #9CA3AF;
            --border-color: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            background-color: var(--content-bg);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar (Menu trái) ===== */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
        }

        .sidebar-header .user-info span {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .sidebar-nav {
            list-style: none;
            margin-top: 24px;
        }

        .sidebar-nav li {
            margin-bottom: 8px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .sidebar-nav a i {
            margin-right: 16px;
            width: 20px;
            text-align: center;
        }

        .sidebar-nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav a.active {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        /* ===== Main content area ===== */
        .main-content {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .main-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-bar {
            position: relative;
        }

        .search-bar input {
            padding: 10px 16px 10px 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.875rem;
            width: 250px;
        }

        .search-bar .fa-search {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: var(--primary-blue-dark);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background-color: var(--content-bg);
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<nav class="sidebar">
    <div class="sidebar-header">
        <div class="avatar">T</div>
        <div class="user-info">
            <strong>Tkmin</strong>
            <span>Admin Thùy</span>
        </div>
    </div>
    <ul class="sidebar-nav">
        <li><a href="dashboard.html"><i class="fa-solid fa-tachometer-alt"></i>Dashboard</a></li>
        <li><a href="claims.html"><i class="fa-solid fa-file-invoice"></i>Claims</a></li>
        <li><a href="parts.html"><i class="fa-solid fa-cogs"></i>Parts</a></li>
        <li><a href="inventory.html"><i class="fa-solid fa-warehouse"></i>Inventory</a></li>
        <li><a href="users.html"><i class="fa-solid fa-users"></i>Users</a></li>
    </ul>
</nav>

<!-- Nội dung chính -->
<main class="main-content" id="main-content">
    <!-- Mỗi trang khác sẽ nạp nội dung riêng vào đây -->
    <header class="main-header">
        <h1>Trang Mẫu</h1>
        <div class="header-actions">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" placeholder="Tìm kiếm...">
            </div>
            <button class="btn-primary">Hành động</button>
        </div>
    </header>
    <p>Đây là nội dung tạm thời. Các trang khác sẽ chèn nội dung riêng tại đây.</p>
</main>
</body>
</html>
