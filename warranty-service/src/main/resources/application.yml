server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Cấu hình Feign Clients
vehicle-service:
  url: http://vehicle-service:8080/vehicle-service/
user-staff-service:
  url: http://user-service:8080/
part-service:
  url: http://part-service:8080/
campaign-service:
  url: http://campaign-service:8080/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM

  # --- [BẮT ĐẦU PHẦN CẦN THÊM/SỬA] ---
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false # Quan trọng nhất: Chuyển Date thành String ISO-8601
    time-zone: Asia/Ho_Chi_Minh       # Quan trọng: Chỉnh múi giờ về VN
    default-property-inclusion: non_null # Tùy chọn: Bỏ qua các trường null cho gọn JSON
  # --- [KẾT THÚC PHẦN CẦN THÊM/SỬA] ---

  datasource:
    url: "jdbc:mysql://mysql-db:3306/warranty_service_db?createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000"
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-cache}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password123
    publisher-confirm-type: correlated
    publisher-returns: true
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN
  cloud:
    compatibility-verifier:
      enabled: false
  main:
    allow-bean-definition-overriding: true

storage:
  location: uploads

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  rabbitmq:
    exchange: oem.internal.exchange
    # [QUAN TRỌNG] Kiểm tra kỹ dòng này
    queue: warranty.vehicle.created.queue
    routing-key: vehicle.created
      # [THÊM MỚI] Cấu hình để nghe lệnh duyệt bảo hành
    consumer:
      queue: part.claim.approved.queue
      routing-key: claim.approved