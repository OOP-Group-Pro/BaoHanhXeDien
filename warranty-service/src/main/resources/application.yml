server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
# Cấu hình Feign Clients:
vehicle-service:
  url: http://vehicle-service:8080/vehicle-service/ # Giả sử Vehicle Service chạy ở port 8081
user-staff-service:
  url: http://user-service:8080/ # Giả sử User Service chạy ở port 8082
part-service:
  url: http://part-service:8080/ # Giả sử Part Service chạy ở port 8083
campaign-service:
  url: http://campaign-service:8080/ # Giả sử Campaign Service chạy ở port 8084
# Cấu hình Feign timeout (giúp tránh chờ đợi quá lâu)
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000


spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM
  datasource:
    url: "jdbc:mysql://mysql-db:3306/warranty_service_db?createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000"
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-cache}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000
  cache:
    type: redis
    redis:
      time-to-live: 600000 # TTL mặc định 10 phút
      cache-null-values: false # Không cache null

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password123
    listener:
      simple:
        acknowledge-mode: auto
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN

  cloud:
    compatibility-verifier:
      enabled: false

  main:
    allow-bean-definition-overriding: true


storage:
  location: uploads

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  rabbitmq:
    exchange: oem.internal.exchange
    queue: warranty.vehicle.created.queue # Queue riêng của Warranty
    routing-key: vehicle.created          # Lắng nghe sự kiện tạo xe
