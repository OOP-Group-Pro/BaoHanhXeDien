server:
  port: 8080

spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:mysql://mysql-db:3306/vehicle_service?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  profiles:
    active: dev

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      user-service:
        url: http://user-service:8080/
      campaign-service:
        url: http://campaign-service:8080/
      part-service:
        url: http://part-service:8080/
      warranty-service:
        url: http://warranty-service:8080/
      default:
        connectTimeout: 5000
        readTimeout: 10000
