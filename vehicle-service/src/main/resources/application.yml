server:
  port: 8002

spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:mysql://localhost:3306/vehicle_service?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  profiles:
    active: dev

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      user-service:
        url: http://localhost:8001/
      campaign-service:
        url: http://localhost:8003/
      part-service:
        url: http://localhost:8004/
      warranty-service:
        url: http://localhost:8005/
      default:
        connectTimeout: 5000
        readTimeout: 10000