server:
  port: 8080
  servlet:
    context-path: /vehicle-service # Chú ý: context-path này quan trọng cho Feign Client
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM
  datasource:
    url: jdbc:mysql://mysql-db:3306/vehicle_service?createDatabaseIfNotExist=true&serverTimezone=UTC&autoReconnect=true&connectTimeout=30000
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  profiles:
    active: dev
  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN
  main:
    allow-bean-definition-overriding: true

  # --- CẤU HÌNH REDIS (MỚI) ---
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-cache}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000

  # --- CẤU HÌNH CACHE (MỚI - MỨC ĐỘ B) ---
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 phút
      cache-null-values: false

    # Kết nối RabbitMQ
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password123
    listener:
      simple:
        acknowledge-mode: auto
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      user-center-service:
        url: http://user-service:8080/
      user-technician-service:
        url: http://user-service:8080/
      campaign-service:
        url: http://campaign-service:8080/
      part-service:
        url: http://part-service:8080/
      warranty-service:
        url: http://warranty-service:8080/
      default:
        connectTimeout: 5000
        readTimeout: 10000


app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  rabbitmq:
    exchange: oem.internal.exchange
    queue: vehicle.user.created.queue   # [Sửa] Bỏ dấu cách thừa trước dấu hai chấm
    routing-key: user.created           # [QUAN TRỌNG] Sửa thành routing-key (số ít) và gán giá trị trực tiếp
    routing-keys:
      vehicle-created: vehicle.created     # [THÊM MỚI] Routing key để gửi đi
# --- LOGGING (MỚI) ---
logging:
  level:
    root: INFO
    org.springframework.cache: DEBUG
    com.oem.evwarranty: DEBUG