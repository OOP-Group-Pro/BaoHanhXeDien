server:
  port: 8080

spring:
  application:
    name: user-service # Đặt tên rõ ràng cho service

  datasource:
    url: jdbc:mysql://mysql-db:3306/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000
    username: root
    password: 1234


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  # --- CẤU HÌNH REDIS (MỚI) ---
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-cache}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000

  # --- CẤU HÌNH CACHE (MỚI - MỨC ĐỘ B) ---
  cache:
    type: redis
    redis:
      time-to-live: 600000 # TTL mặc định 10 phút (600s)
      cache-null-values: false # Không cache giá trị null để tránh lỗi logic

  rabbitmq:
    host: rabbitmq        # Tên service trong docker-compose
    port: 5672
    username: admin
    password: password123
    # Đảm bảo publisher confirm để tránh mất tin
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual # [OPTION] Nếu sau này User Service cũng nhận ti
  sql:
    init:
      mode: always


  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN
  main:
    allow-bean-definition-overriding: true

service:
  vehicle:
    url: http://vehicle-service:8080
  warranty:
    url: http://warranty-service:8080
  part:
    url: http://part-service:8080
  campaign:
    url: http://campaign-service:8080

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

circuitbreaker:
  enabled: true

# --- CẤU HÌNH LOGGING (MỚI) ---
logging:
  level:
    root: INFO
    org.springframework.cache: DEBUG # Để soi log cache hit/miss
    com.oem.evwarranty: DEBUG
    org.springframework.security: DEBUG
    #     Để debug log gửi/nhận RabbitMQ
    org.springframework.amqp: DEBUG
    # ... giữ lại các log cũ ...
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

error:
  include-message: always
  include-binding-errors: always
  include-stacktrace: always

# ... các cấu hình khác bên trên ...

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  rabbitmq:
    exchange: oem.internal.exchange
    routing-keys:
      user-created: user.created   # <--- Dòng này bắt buộc phải có và thụt lề đúng
      # Key định tuyến cho sự kiện tạo user
jwt:
  secret: ${JWT_SECRET}