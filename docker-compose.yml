version: '3.8'

services:
  # 1. CSDL MYSQL
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: sharedDB
    ports:
      - "3307:3306"
    networks:
      - oem-network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 2. USER-SERVICE
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8080"
    networks:
      - oem-network
    environment:
      JWT_SECRET: "we_dont_talk_anymore_like_we_used_to_do"
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 3. VEHICLE-SERVICE
  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    container_name: vehicle-service
    ports:
      - "8002:8080"
    networks:
      - oem-network
    environment:
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 4. PART-SERVICE
  part-service:
    build:
      context: .
      dockerfile: part-service/Dockerfile
    container_name: part-service
    ports:
      - "8004:8080"
    networks:
      - oem-network
    environment:
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 5. CAMPAIGN-SERVICE
  campaign-service:
    build:
      context: .
      dockerfile: campaign-service/Dockerfile
    container_name: campaign-service
    ports:
      - "8003:8080"
    networks:
      - oem-network
    environment:
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 6. WARRANTY-SERVICE
  warranty-service:
    build:
      context: .
      dockerfile: warranty-service/Dockerfile
    container_name: warranty-service
    ports:
      - "8005:8080"
    networks:
      - oem-network
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"
    environment:
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    depends_on:
      mysql-db:
        condition: service_healthy
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      part-service:
        condition: service_started
      campaign-service:
        condition: service_started

  # 7. API-GATEWAY (Đã đúng từ trước)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile # <-- ĐÃ SỬA (Đúng)
    container_name: api-gateway
    ports:
      - "80:8080"
    networks:
      - oem-network
    environment:
      JWT_SECRET: "we_dont_talk_anymore_like_we_used_to_do"
      INTERNAL_SERVICE_SECRET: "we_dont_talk_anymore"
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"
    depends_on:
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      part-service:
        condition: service_started
      campaign-service:
        condition: service_started
      warranty-service:
        condition: service_started

networks:
  oem-network:
    driver: bridge

volumes:
  db_data: