
services:
  # 1. CSDL MYSQL
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: sharedDB # Dữ liệu này chỉ là DB ban đầu Docker tạo
    ports:
      - "8080:3306"
    networks:
      - oem-network
    volumes:
      - db_data:/var/lib/mysql

    # 🌟 BỔ SUNG QUAN TRỌNG: Healthcheck
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s

  # 2. USER-SERVICE
  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8080"
    networks:
      - oem-network
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 3. VEHICLE-SERVICE
  vehicle-service:
    build:
      context: .
      dockerfile: ./vehicle-service/Dockerfile
    container_name: vehicle-service
    ports:
      - "8002:8080"
    networks:
      - oem-network
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 4. PART-SERVICE (Đã thêm depends_on)
  part-service:
    build:
      context: . # Sửa thành thư mục gốc
      dockerfile: ./part-service/Dockerfile # Chỉ định rõ Dockerfile cần dùng
    container_name: part-service
    ports:
      - "8004:8080"
    networks:
      - oem-network
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 5. CAMPAIGN-SERVICE (Đã sửa lỗi cú pháp và depends_on)
  campaign-service:
    build:
      context: . # Sửa thành thư mục gốc
      dockerfile: ./campaign-service/Dockerfile # Chỉ định rõ Dockerfile cần dùng
    container_name: campaign-service
    ports:
      - "8003:8080"
    networks:
      - oem-network
    depends_on:
      mysql-db:
        condition: service_healthy
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"

  # 6. WARRANTY-SERVICE (ĐÃ THÊM depends_on CHÍNH XÁC)
  warranty-service:
    build:
      context: .
      dockerfile: ./warranty-service/Dockerfile
    container_name: warranty-service
    ports:
      - "8005:8080"
    networks:
      - oem-network
    command: /bin/sh -c "sleep 15 && java -jar /app.jar"
    # Khai báo phụ thuộc cho WARRANTY-SERVICE
    depends_on:
      mysql-db:
        condition: service_healthy
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      part-service:
        condition: service_started
      campaign-service:
        condition: service_started
      # Đảm bảo tất cả chạy trước khi Warranty Service khởi động

networks:
  oem-network:
    driver: bridge

volumes:
  db_data: