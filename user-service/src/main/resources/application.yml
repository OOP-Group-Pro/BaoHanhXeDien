server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

service:
  vehicle:
    url: http://vehicle-service:8080
  warranty:
    url: http://warranty-service:8080
  part:
    url: http://part-service:8080
  campaign:
    url: http://campaign-service:8080

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

circuitbreaker:
  enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR

error:
  include-message: always
  include-binding-errors: always
  include-stacktrace: always