server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: identity_user
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
service:
  vehicle:
    url: http://vehicle-service:8002
  warranty:
    url: http://warranty-service:8005
  part:
    url: http://part-service:8004
  campaign:
    url: http://campaign-service:8003
