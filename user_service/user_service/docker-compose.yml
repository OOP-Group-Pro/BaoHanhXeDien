version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_service_db
      MYSQL_USER: identity_user
      MYSQL_PASSWORD: 123456
    ports:
      - "3310:3306"
    networks:
      - spring-network

  user_service:
    build: .
    container_name: user_service
    ports:
      - "8001:8001"
    depends_on:
      - mysql
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge
