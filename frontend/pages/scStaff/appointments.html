<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Lịch hẹn (Campaign) - OEM Warranty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/dashboard.css">
</head>

<body id="sc-appointments-page">

<aside class="sidebar" id="sidebar-placeholder"></aside>

<div class="main-content">
    <header class="header" id="header-placeholder"></header>

    <main class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Quản lý Lịch hẹn Chiến dịch</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createApptModal">
                <i class="bi bi-plus-circle me-2"></i>Tạo Lịch Mới
            </button>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Chọn Chiến dịch</label>
                        <select class="form-select" id="filterCampaign">
                            <option value="">-- Đang tải chiến dịch... --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Trạng thái Lịch</label>
                        <select class="form-select" id="filterStatus">
                            <option value="">Tất cả</option>
                            <option value="SCHEDULED" selected>Đã đặt lịch (Scheduled)</option>
                            <option value="RESCHEDULED">Đã dời (Rescheduled)</option>
                            <option value="DONE">Hoàn thành (Done)</option>
                            <option value="CANCELLED">Đã hủy (Cancelled)</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary w-100" id="btnFilter">
                            <i class="bi bi-funnel me-2"></i> Lọc Dữ liệu
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Mã Lịch</th>
                            <th>Xe (VIN)</th>
                            <th>Thời gian hẹn</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="appointmentsTbody">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                Vui lòng chọn Chiến dịch và bấm Lọc để xem dữ liệu.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="d-flex justify-content-end p-3">
                    <ul class="pagination mb-0" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="createApptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Tạo Lịch Hẹn Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createApptForm">
                    <div class="mb-3">
                        <label class="form-label">Chiến dịch (*)</label>
                        <select class="form-select" id="newApptCampaign" required>
                            <option value="">-- Chọn --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Xe (Nhập VIN) (*)</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="newApptVin" placeholder="Nhập VIN..." required>
                            <button class="btn btn-outline-secondary" type="button" id="btnCheckVin">Check</button>
                        </div>
                        <div id="vinCheckResult" class="form-text text-danger"></div>
                        <input type="hidden" id="newApptAffectedId"> </div>
                    <div class="mb-3">
                        <label class="form-label">Thời gian hẹn (*)</label>
                        <input type="datetime-local" class="form-control" id="newApptDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trung tâm Dịch vụ (*)</label>
                        <input type="text" class="form-control" id="newApptCenterId" value="101" readonly>
                        <div class="form-text">ID Trung tâm của bạn</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" id="btnSaveAppt">Lưu Lịch Hẹn</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="rescheduleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">Dời Lịch Hẹn</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="rescheduleForm">
                    <input type="hidden" id="rescheduleApptId">
                    <div class="mb-3">
                        <label class="form-label">Thời gian mới (*)</label>
                        <input type="datetime-local" class="form-control" id="rescheduleDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-warning" id="btnSaveReschedule">Cập nhật</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/scStaff.js"></script>

</body>
</html>
