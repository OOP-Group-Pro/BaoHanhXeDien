<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Claim Mới - SC Staff</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body id="sc-create-claim-page">

<aside class="sidebar" id="sidebar-placeholder">
</aside>

<div class="main-content">

    <header class="header" id="header-placeholder">
    </header>

    <main class="container-fluid p-4">
        <h1 class="h3 mb-3">Tạo Yêu cầu Bảo hành Mới</h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="claim-form">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="vin" class="form-label">Số VIN (17 ký tự)</label>
                            <input type="text" class="form-control" id="vin" placeholder="Nhập số VIN của xe" required minlength="17" maxlength="17">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="description" class="form-label">Mô tả Lỗi</label>
                            <textarea class="form-control" id="description" rows="5" placeholder="Mô tả chi tiết triệu chứng lỗi..." required></textarea>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="technicianId" class="form-label">Chỉ định Kỹ thuật viên</label>
                                <select class="form-select" id="technicianId" required>
                                    <option value="" disabled selected>Đang tải danh sách KTV...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <hr class="my-4">
                    <div class="d-flex justify-content-end">
                        <button type="submit" id="create-claim-btn" class="btn btn-primary btn-lg">Gửi Yêu cầu</button>
                    </div>
                    <p id="form-error" class="text-danger mt-3 text-end"></p>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/scStaff.js"></script>
</body>
</html>
