<!--pages/scStaff/claim-list.html-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách Claim - SC Staff</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body id="sc-claim-list-page">

<div class="d-flex">
  <div id="sidebar-placeholder"></div>

  <div class="main-content flex-grow-1">
    <div id="header-placeholder"></div>

    <main class="container-fluid p-4">
      <h1 class="h3 mb-3">Danh sách Yêu cầu Bảo hành</h1>

      <div class="card shadow-sm mb-4 filters-bar">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label for="filter-vin" class="form-label">Số VIN</label>
              <input type="text" class="form-control" id="filter-vin" placeholder="Tìm theo 17 ký tự VIN">
            </div>
            <div class="col-md-3">
              <label for="filter-claim-code" class="form-label">Mã Claim</label>
              <input type="text" class="form-control" id="filter-claim-code" placeholder="Tìm theo mã...">
            </div>
            ...
            <div class="col-md-3">
              <label for="filter-status" class="form-label">Trạng thái</label>
              <select id="filter-status" class="form-select">
                <option value="">Tất cả Trạng thái</option>
                <option value="WAITING_APPROVAL">Đang chờ duyệt</option>
                <option value="APPROVED">Đã duyệt</option>
                <option value="REJECTED">Đã từ chối</option>
                <option value="IS_PROCESSING">Đang xử lý</option> <option value="COMPLETED">Hoàn thành</option>
              </select>
            </div>
            <div class="col-md-3 d-flex">
              <button class="btn btn-primary me-2" id="filter-apply-btn">Lọc</button>
              <button class="btn btn-outline-secondary" id="filter-clear-btn">Xóa lọc</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div id="claims-loading" class="text-center p-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div id="claims-error" class="alert alert-danger d-none"></div>

          <div class="table-responsive d-none" id="claims-table-container">
            <table class="table table-hover align-middle">
              <thead class="table-light">
              <tr>
                <th>Mã Claim</th>
                <th>Số VIN</th>
                <th>Khách hàng</th>
                <th>Ngày tạo</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
              </thead>
              <tbody id="claims-tbody">
              </tbody>
            </table>
          </div>

          <nav id="pagination-container" class="d-none" aria-label="Page navigation">
            <ul class="pagination justify-content-center" id="pagination-controls">
            </ul>
          </nav>

          <p id="no-claims-message" class="text-muted text-center d-none p-3">
            Không tìm thấy yêu cầu nào.
          </p>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module" src="/src/scStaff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
