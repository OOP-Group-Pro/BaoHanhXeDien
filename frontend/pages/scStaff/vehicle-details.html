<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thông tin Chi tiết Xe - SC Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../src/styles/dashboard.css">

</head>
<body id="sc-vehicle-detail-page">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar-placeholder"></aside>

<!-- Main -->
<div class="main-content">
    <!-- Header -->
    <header class="header" id="header-placeholder"></header>

    <main class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Thông tin Chi tiết Xe</h1>
            <div class="text-muted">
                <i class="bi bi-person-badge"></i> SC Staff
            </div>
        </div>

        <!-- Thông tin chính -->
        <section class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Thông tin Chính</span>
                <div class="d-flex gap-2">
                    <div class="input-group input-group-sm" style="width: 320px;">
                        <span class="input-group-text">VIN</span>
                        <input id="vin-input" type="text" class="form-control" placeholder="Nhập VIN hoặc để trống dùng ?vin=">
                        <button id="vin-search-btn" class="btn btn-primary"><i class="bi bi-search"></i></button>
                    </div>
                </div>
            </div>
            <div class="card-body row gy-2">
                <div class="col-md-6">
                    <div><span class="text-secondary">VIN:</span> <span id="vd-vin" class="fw-semibold">--</span></div>
                    <div><span class="text-secondary">Model:</span> <span id="vd-model">--</span></div>
                    <div><span class="text-secondary">Năm SX:</span> <span id="vd-year">--</span></div>
                </div>
                <div class="col-md-6">
                    <div><span class="text-secondary">Tên chủ xe:</span> <span id="vd-owner">--</span></div>
                    <div><span class="text-secondary">Số điện thoại:</span> <span id="vd-phone">--</span></div>
                    <div><span class="text-secondary">Địa chỉ:</span> <span id="vd-address">--</span></div>
                </div>
            </div>
        </section>

        <!-- Lịch sử Dịch vụ & Bảo hành -->
        <section class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Lịch sử Dịch vụ & Bảo hành</span>
                <div class="d-flex gap-2">
                    <select id="history-type-filter" class="form-select form-select-sm" style="width:220px;">
                        <option value="">Tất cả loại dịch vụ</option>
                        <option value="MAINTENANCE">Bảo dưỡng</option>
                        <option value="RECALL">Chiến dịch (Recall)</option>
                        <option value="REPAIR">Sửa chữa</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div id="history-empty" class="alert alert-light border d-none">Chưa có lịch sử.</div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th style="width: 140px;">Ngày</th>
                            <th>Loại Dịch vụ</th>
                            <th style="width: 220px;">Trung tâm</th>
                            <th style="width: 120px;">Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <a class="btn outline" id="go-history">Xem lịch sử</a>
        <script>
            document.getElementById('go-history')?.addEventListener('click', () => {
              const vin = new URLSearchParams(location.search).get('vin') || '';
              location.href = `/frontend/pages/scStaff/vehicle-history.html${vin ? `?vin=${encodeURIComponent(vin)}` : ''}`;
            });
        </script>


    </main>
</div>

<script type="module" src="../../src/scStaff.js"></script>

</body>
</html>
