<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC Staff Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body id="sc-claim-list-page">

<aside class="sidebar" id="sidebar-placeholder"></aside>

<div class="main-content">

    <header class="header" id="header-placeholder"></header>

    <main class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3">Dashboard & Quản lý Claims</h1>
            <a href="/pages/scStaff/create-claim.html" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Tạo Claim Mới
            </a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Claims Chờ xử lý</h5>
                        <p class="card-text fs-2" id="claims-pending-count">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Claims Đã duyệt</h5>
                        <p class="card-text fs-2" id="claims-approved-count">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">
                Danh sách Claims
            </div>

            <div class="card-body border-bottom filters-bar">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="filter-vin" class="form-label">VIN</label>
                        <input type="text" class="form-control" id="filter-vin" placeholder="Tìm theo VIN...">
                    </div>
                    <div class="col-md-3">
                        <label for="filter-claim-code" class="form-label">Mã Claim</label>
                        <input type="text" class="form-control" id="filter-claim-code" placeholder="Tìm theo Mã Claim...">
                    </div>
                    <div class="col-md-3">
                        <label for="filter-status" class="form-label">Trạng thái</label>
                        <select id="filter-status" class="form-select">
                            <option value="">Tất cả</option>
                            <option value="WAITING_APPROVAL">Chờ duyệt</option>
                            <option value="APPROVED">Đã duyệt</option>
                            <option value="COMPLETED">Hoàn thành</option>
                            <option value="REJECTED">Từ chối</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary me-2" id="filter-apply-btn">Lọc</button>
                        <button class="btn btn-outline-secondary" id="filter-clear-btn">Xóa lọc</button>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <div id="claims-loading" class="text-center p-4 d-none">
                    <div class="spinner-border" role="status"></div>
                    <p class="mt-2">Đang tải dữ liệu...</p>
                </div>
                <div id="claims-error" class="alert alert-danger d-none"></div>
                <div id="no-claims-message" class="text-center p-4 d-none">
                    <p>Không tìm thấy claim nào phù hợp.</p>
                </div>

                <div id="claims-table-container" class="table-responsive d-none">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Mã Claim</th>
                            <th>Số VIN</th>
                            <th>Khách hàng</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="claims-tbody">
                        </tbody>
                    </table>
                </div>

                <nav id="pagination-container" class="d-none">
                    <ul id="pagination-controls" class="pagination justify-content-center">
                    </ul>
                </nav>
            </div>
        </div>

    </main>
</div>

<div class="modal fade" id="claimDetailsModal" tabindex="-1" aria-labelledby="claimModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="claimModalTitle">Chi tiết Claim</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="claimModalBody">
                <p>Đang tải...</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/scStaff.js"></script>
</body>
</html>
