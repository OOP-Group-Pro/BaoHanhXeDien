<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC Staff Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body>

<aside class="sidebar" id="sidebar-placeholder">
</aside>

<div class="main-content">

    <header class="header" id="header-placeholder">
    </header>

    <main class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3">SC Staff Dashboard</h1>
            <a href="create-claim.html" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Tạo Claim Mới
            </a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Claims Chờ xử lý</h5>
                        <p class="card-text fs-2" id="claims-pending-count">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Claims Đã duyệt</h5>
                        <p class="card-text fs-2" id="claims-approved-count">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                Hoạt động Claim Gần đây
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Mã Claim</th>
                        <th>Số VIN</th>
                        <th>Ngày tạo</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="claims-table-body">
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script type="module" src="/src/scStaff.js"></script>
</body>
</html>
