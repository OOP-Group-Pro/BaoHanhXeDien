<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM Staff - Phê duyệt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/src/styles/evm-dashboard.css">
</head>
<body id="evm-dashboard-page">

<aside class="sidebar" id="sidebar-placeholder"></aside>

<div class="main-content">
    <header class="header" id="header-placeholder"></header>

    <main class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Dashboard & Phê duyệt</h1>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Chờ Xử Lý</h5>
                        <p class="card-text fs-2" id="kpi-pending">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Đã Duyệt (Tháng này)</h5>
                        <p class="card-text fs-2" id="kpi-approved">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">Hàng đợi Phê duyệt (Waiting Approval)</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Mã Claim</th>
                            <th>VIN</th>
                            <th>Mô tả lỗi</th>
                            <th>Ngày gửi</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="approval-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Thẩm định Yêu cầu: <span id="modal-claim-code" class="fw-bold text-primary">...</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modal-body-content">
                <div class="text-center p-5"><div class="spinner-border text-primary"></div></div>
            </div>
            <div class="modal-footer bg-light justify-content-between">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-danger" id="btn-reject-action">
                        <i class="bi bi-x-circle"></i> Từ chối
                    </button>
                    <button type="button" class="btn btn-success" id="btn-approve-action">
                        <i class="bi bi-check-circle"></i> Phê duyệt
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/evmStaff.js"></script>
</body>
</html>
