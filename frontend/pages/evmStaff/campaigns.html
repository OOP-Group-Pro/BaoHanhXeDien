<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Chiến dịch - OEM EV Warranty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/dashboard.css">
</head>

<body id="evm-campaigns-page">

<aside class="sidebar" id="sidebar-placeholder"></aside>

<div class="main-content">
    <header class="header" id="header-placeholder"></header>

    <main class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Quản lý Chiến dịch (Recall & Service)</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createCampaignModal">
                <i class="bi bi-plus-lg me-2"></i>Tạo Chiến dịch Mới
            </button>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="filterCode" placeholder="Tìm theo Mã hoặc Tên...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterStatus">
                            <option value="">-- Tất cả Trạng thái --</option>
                            <option value="DRAFT">Nháp (Draft)</option>
                            <option value="ACTIVE">Đang chạy (Active)</option>
                            <option value="CLOSED">Đã đóng (Closed)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" id="btnFilter">
                            <i class="bi bi-search"></i> Tìm
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Mã Chiến dịch</th>
                            <th>Tên Chiến dịch</th>
                            <th>Loại</th>
                            <th>Thời gian Hiệu lực</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-4">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="campaignTbody">
                        <tr><td colspan="6" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav class="d-flex justify-content-end p-3">
                    <ul class="pagination mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="createCampaignModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Khởi tạo Chiến dịch Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createCampaignForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Mã Chiến dịch (*)</label>
                            <input type="text" class="form-control" id="campCode" placeholder="VD: RECALL-2025-001" required>
                            <div class="form-text">Mã duy nhất định danh chiến dịch.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Loại Chiến dịch (*)</label>
                            <select class="form-select" id="campType" required>
                                <option value="RECALL">Triệu hồi (Recall)</option>
                                <option value="SERVICE">Dịch vụ (Service)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên tiêu đề (*)</label>
                        <input type="text" class="form-control" id="campTitle" placeholder="VD: Thay thế cụm pin cao áp..." required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ngày bắt đầu (*)</label>
                            <input type="datetime-local" class="form-control" id="campStart" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ngày kết thúc (*)</label>
                            <input type="datetime-local" class="form-control" id="campEnd" required>
                        </div>
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label class="form-label fw-bold d-flex justify-content-between">
                            <span>Danh sách xe ảnh hưởng (VIN)</span>
                            <small class="text-muted fw-normal">Mỗi dòng 1 số VIN</small>
                        </label>
                        <textarea class="form-control font-monospace" id="campVins" rows="5" placeholder="VF812345...\nVF867890..."></textarea>
                        <div class="form-text text-primary" id="vinCount">Đã nhập: 0 VIN</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                <button type="button" class="btn btn-success" id="btnSaveCampaign">Lưu & Phát hành</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/evmStaff.js"></script>
</body>
</html>
