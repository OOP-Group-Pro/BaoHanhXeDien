<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Technician Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/evm-dashboard.css">

</head>
<body>

<nav id="sidebar-placeholder" class="sidebar"></nav>

<main class="main-content">
    <header class="main-header">
        <h1>Hồ sơ cá nhân</h1>
    </header>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-avatar-large" id="profile-avatar-text">T</div>
            <h2 id="profile-name">Đang tải...</h2>
            <p id="profile-role">Kỹ thuật viên</p>
            <span class="status-badge" id="profile-status-badge">Active</span>
            <button class="btn btn-primary" id="editProfileBtn" style="margin-top:15px;">Chỉnh sửa hồ sơ</button>
        </div>

        <div class="profile-details-card">
            <div class="card-header">Thông tin chi tiết</div>
            <div class="card-body">
                <div class="form-group">
                    <label>Mã NV</label>
                    <input type="text" id="profile-id" readonly>
                </div>
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="profile-fullname" readonly>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profile-email" readonly>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="profile-phone" readonly>
                </div>
                <div class="form-group">
                    <label>Chức vụ</label>
                    <input type="text" id="profile-role-detail" readonly>
                </div>
                <div class="form-group">
                    <label>Chi nhánh</label>
                    <input type="text" id="profile-branch" readonly>
                </div>
            </div>
            <div class="card-footer">
                <button id="btn-logout" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </div>
    </div>
</main>

<!-- Modal chỉnh sửa hồ sơ -->
<div class="modal-popup" id="profileModal">
    <div class="modal-box">
        <button class="close-btn" id="closeModal">&times;</button>
        <h3>Chỉnh sửa hồ sơ</h3>

        <label>Họ và tên</label>
        <input type="text" id="modal-fullname">

        <label>Email</label>
        <input type="email" id="modal-email">

        <label>Số điện thoại</label>
        <input type="text" id="modal-phone">

        <label>Chức vụ</label>
        <input type="text" id="modal-role">

        <label>Chi nhánh</label>
        <input type="text" id="modal-branch">

        <button id="saveProfileBtn">Lưu</button>
    </div>
</div>
<script type="module" src="../../src/JS/evm-profile.js"></script>
</body>
</html>
