<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | OEM EV Warranty System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../src/styles/style-admin.css">
</head>
<body>
<nav class="sidebar">
    <div class="sidebar-header">
        <div class="avatar">A</div>
        <div class="user-info">
            <strong>Admin</strong>
            <span>Admin Thùy</span>
        </div>
    </div>
    <ul class="sidebar-nav">
        <li><a href="#"><i class="fa-solid fa-tachometer-alt"></i>Dashboard</a></li>
        <li><a href="users.html" class="active"><i class="fa-solid fa-file-invoice"></i>Quản lí người dùng</a></li>
        <li><a href="request.html"><i class="fa-solid fa-cogs"></i>Phiếu đề xuất</a></li>
        <li><a href="inventory.html"><i class="fa-solid fa-warehouse"></i>Quản lý Kho</a></li>
        <li><a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i>Logout</a></li>
    </ul>
</nav>

<main class="main-content">
    <header class="main-header">
        <h1>Dashboard 👨‍💻</h1>
        <div class="header-actions">
            <button class="btn-primary" id="refresh-btn"><i class="fa-solid fa-sync"></i> Cập nhật dữ liệu</button>
        </div>
    </header>

    <div class="content-area" style="grid-template-columns: 1fr 1fr;">
        <!-- Recent Requests -->
        <div class="table-container">
            <h2>Yêu cầu Gần đây</h2>
            <table class="user-table" id="requests-table">
                <thead>
                <tr>
                    <th>Mã Yêu cầu</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr><td colspan="2" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- User Summary -->
        <div class="table-container">
            <h2>Tổng quan Người dùng</h2>
            <table class="user-table" id="users-summary-table">
                <thead>
                <tr>
                    <th>Role</th>
                    <th>Số lượng</th>
                </tr>
                </thead>
                <tbody>
                <tr><td colspan="2" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script type="module" src="/src/dashboard.js"></script>
</body>
</html>
