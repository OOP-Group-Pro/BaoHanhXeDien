<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lí Người dùng | OEM EV Warranty Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../../src/styles/style-admin.css">
</head>
<body>

<nav class="sidebar"></nav>

<main class="main-content" id="main-content">
    <header class="main-header">
        <h1>Quản lí Người dùng 👥</h1>
        <div class="header-actions">
            <div class="btn-group">
                <button class="btn-secondary"><i class="fa-solid fa-file-import"></i> Import</button>
                <button class="btn-secondary"><i class="fa-solid fa-file-export"></i> Export</button>
            </div>
            <button class="btn-primary" id="add-user-btn"><i class="fa-solid fa-user-plus"></i> Thêm Mới</button>
        </div>
    </header>

    <div class="filter-section">
        <div class="filter-group">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="search-input" placeholder="Tìm tên, email, sđt...">
        </div>

        <div class="filter-group">
            <i class="fa-solid fa-user-tag"></i>
            <select id="filter-role">
                <option value="">-- Tất cả Vai trò --</option>
                <option value="ADMIN">Admin</option>
                <option value="SC_STAFF">SC Staff</option>
                <option value="SC_TECHNICIAN">SC Technician</option>
                <option value="EVM_STAFF">EVM Staff</option>
                <option value="MANAGER">Manager</option>
            </select>
        </div>

        <div class="filter-group">
            <i class="fa-solid fa-building"></i>
            <input type="number" id="filter-center" placeholder="Mã Trung tâm (ID)">
        </div>

        <div class="filter-group">
            <i class="fa-solid fa-toggle-on"></i>
            <select id="filter-status">
                <option value="">-- Tất cả Trạng thái --</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
                <option value="BLOCKED">Blocked</option>
            </select>
        </div>

        <button id="btn-clear-filter" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>
    <div class="content-area" style="grid-template-columns: 1fr;">
        <div class="table-container">
            <table class="user-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Vai trò</th>
                    <th>TTDV</th> <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody id="user-table-body">
                <tr><td colspan="8" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Thêm/Sửa User -->
<div id="user-modal" class="modal-popup">
    <div class="modal-box">
        <button class="close-btn" id="close-modal-btn">&times;</button>
        <h3 id="modal-title">Thêm Người dùng</h3>
        <input type="hidden" id="user-id">

        <label>Username</label>
        <input type="text" id="username">

        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" id="password">
            <i class="fa-solid fa-eye" id="toggle-password"></i>
        </div>
        <script>
            const pass = document.getElementById("password");
            const toggle = document.getElementById("toggle-password");

            toggle.onclick = () => pass.type = pass.type === "password" ? "text" : "password";
        </script>

        <label>Email</label>
        <input type="email" id="email">

        <label>Phone</label>
        <input type="text" id="phone">

        <label>Role</label>
        <select id="role">
            <option value="ADMIN">Admin</option>
            <option value="SC_STAFF">SC Staff</option>
            <option value="SC_TECHNICIAN">SC Technician</option>
            <option value="EVM_STAFF">EVM Staff</option>
            <option value="MANAGER">Manager</option>
        </select>

        <label>Status</label>
        <select id="status">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="BLOCKED">Blocked</option>
        </select>

        <button id="save-user-btn">Lưu</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/src/admin.js"></script>

<style>
    /* Bảng user */
    /* Bảng user */
    .user-table { width: 100%; border-collapse: collapse; background-color: #fff; border-radius: 8px; overflow: hidden; }
    .user-table th, .user-table td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .user-table th { background-color: #007BFF; color: #fff; }
    .user-table tr:hover { background-color: #f1f1f1; }
    .btn-action { padding: 4px 8px; margin-right: 4px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
    .btn-edit { background-color: #28a745; }
    .btn-delete { background-color: #dc3545; }

    /* Modal popup */
    .modal-popup { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-popup.show { display:flex; }

    .modal-box { background:#fff; border-radius:12px; width:400px; max-width:90%; padding:20px; box-shadow:0 5px 20px rgba(0,0,0,0.2); position: relative; }
    .modal-box h3 { margin-top:0; margin-bottom:15px; font-size:1.3rem; padding-right: 30px; /* Chừa chỗ cho nút close */ }
    .modal-box label { display:block; margin-top:8px; font-weight:500; }
    .modal-box input, .modal-box select { width:100%; padding:7px 10px; margin-top:4px; border-radius:6px; border:1px solid #ccc; box-sizing: border-box; }

    /* Style cho nút Save/Submit (Loại trừ nút close) */
    .modal-box button:not(.close-btn) {
        margin-top:15px;
        width:100%;
        padding:8px;
        background-color:#007BFF;
        border:none;
        color:#fff;
        font-size:1rem;
        border-radius:6px;
        cursor:pointer;
    }

    /* Style riêng cho nút Close để nằm góc phải */
    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;

        /* Reset lại các thuộc tính bị dính từ nút thường */
        width: 30px;
        height: 30px;
        background: transparent;
        color: #555;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;

        /* Căn giữa dấu X */
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: 0.2s;
    }

    .close-btn:hover {
        background-color: #f1f1f1;
        color: #ff0000;
    }

    /* Style cho thanh bộ lọc */
    .filter-section {
        display: flex;
        gap: 15px;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        flex-wrap: wrap;
        align-items: center;
    }

    .filter-group {
        display: flex;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 5px 10px;
        background: #f9f9f9;
        flex: 1;
        min-width: 150px;
    }

    .filter-group i {
        color: #666;
        margin-right: 8px;
    }

    .filter-group input,
    .filter-group select {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #333;
    }

    #btn-clear-filter {
        padding: 8px 15px;
        background: #6c757d;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
    }

    #btn-clear-filter:hover {
        background: #5a6268;
    }

    /* --- Avatar User --- */
    .user-info-cell {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        text-transform: uppercase;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* --- Status Dot (Chấm tròn trạng thái) --- */
    .status-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
    }
    .status-dot-green {
        background-color: #28a745; /* Xanh lá */
        box-shadow: 0 0 4px #28a745;
    }
    .status-dot-red {
        background-color: #dc3545; /* Đỏ */
        box-shadow: 0 0 4px #dc3545;
    }
    .status-dot-grey {
        background-color: #6c757d; /* Xám */
    }
    .status-text {
        font-weight: 500;
        font-size: 0.9rem;
        color: #333;
        text-transform: capitalize; /* Viết hoa chữ cái đầu: Active */
    }

    /* Role Badge nhỏ gọn hơn */
    .role-badge {
        background-color: #eef2f7;
        color: #333;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        border: 1px solid #dee2e6;
    }

    .password-wrapper { position:relative; }
    .password-wrapper i { position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:#555; }
</style>

</body>
</html>
