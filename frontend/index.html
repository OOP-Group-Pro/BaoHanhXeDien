<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OEM Warranty Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="login-background">

<div class="login-container">
  <form id="login-form">
    <h2 class="text-center mb-4">OEM Warranty System</h2>

    <div class="mb-3">
      <label for="username" class="form-label">Tên đăng nhập</label>
      <input type="text" class="form-control" id="username" value="SCStaff" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" id="password" value="staff123" required>
    </div>

    <button type="submit" id="login-button" class="btn btn-primary w-100">Đăng nhập</button>
    <p id="login-error" class="text-danger mt-2"></p>
  </form>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
