<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV WarrantyPro | Internal Login</title>

  <link rel="stylesheet" href="/src/styles/login.css" />
</head>
<body>
<div class="background">
  <div class="overlay"></div>

  <div class="branding">
    <div class="brand-logo">
      <img src="/public/images/logo.png" alt="Black Car Icon" />
      <h1>EV WarrantyPro</h1>
    </div>
    <p>Internal EV Management System</p>
  </div>

  <div class="login-container">
    <div class="login-box">
      <h2>Internal Login</h2>
      <form id="login-form">
        <input type="text" id="username" placeholder="Username" value="SCStaff" required />
        <input type="password" id="password" placeholder="Password" value="staff123" required />

        <div class="remember">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="login-btn" id="login-button">LOGIN</button>
      </form>

      <p id="login-error" class="error-message"></p>

      <p class="note">For authorized personnel only</p>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
