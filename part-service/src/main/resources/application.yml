server:
  port: 8004 # Giữ lại port 8004 từ nhánh part-service vì nó cụ thể cho service này
logging:
  level:
    org:
      springframework: DEBUG
spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM
  datasource:
    # Sử dụng URL database cụ thể từ nhánh part-service
    url: "jdbc:mysql://localhost:3306/part_service"
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Giữ lại cấu hình Feign Client từ nhánh part-service
feign:
  client:
    config:
      user-service:
        url: http://localhost:8001
      vehicle-service:
        url : http://localhost:8003