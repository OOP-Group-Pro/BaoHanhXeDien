server:
  port: 8080 #Thay port cho moi service  # 🚀 false = bỏ xác thực, true = bật xác thực

logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: part-service
  datasource:
    url: jdbc:mysql://mysql-db:3306/part_service?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost} # Mặc định localhost nếu chạy ngoài docker
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
  main:
    allow-bean-definition-overriding: true

# Các service URL (tốt, giữ nguyên)
vehicle-service:
  url: http://vehicle-service:8080/
user-service:
  url: http://user-service:8080/
warranty-service:
  url: http://warranty-service:8080/
campaign-service:
  url: http://campaign-service:8080/


feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
