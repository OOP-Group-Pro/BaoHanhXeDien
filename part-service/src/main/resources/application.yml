server:
  port: 8004

logging:
  level:
    org.springframework: DEBUG

spring:
  application:
    name: OEM_EV_WARRANTY_MANAGEMENT_SYSTEM
  datasource:
    url: jdbc:mysql://localhost:3306/part_service
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Các service URL (tốt, giữ nguyên)
vehicle-service:
  url: http://localhost:8002/
user-service:
  url: http://localhost:8001/
warranty-service:
  url: http://localhost:8005/
campaign-service:
  url: http://localhost:8003/


feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full
