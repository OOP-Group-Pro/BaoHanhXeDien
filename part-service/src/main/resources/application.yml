server:
  port: 8080

logging:
  level:
    com.oem.evpart: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG

spring:
  application:
    name: part-service

  # 🔥 [THÊM ĐOẠN NÀY ĐỂ FIX LỖI 500 "UNKNOWN ERROR"] 🔥
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false # Trả về dạng String "2025-11-23T..." thay vì mảng số
    time-zone: Asia/Ho_Chi_Minh       # Múi giờ VN
    default-property-inclusion: non_null # Bỏ qua các trường null cho gọn
  # -----------------------------------------------------

  datasource:
    url: jdbc:mysql://mysql-db:3306/part_service?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

  security:
    user:
      name: admin
      password: 1234
      roles: ADMIN

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-cache} # Lưu ý: nên để fallback là redis-cache nếu chạy docker
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  main:
    allow-bean-definition-overriding: true

vehicle-service:
  url: http://vehicle-service:8080/
user-service:
  url: http://user-service:8080/
warranty-service:
  url: http://warranty-service:8080/
campaign-service:
  url: http://campaign-service:8080/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true